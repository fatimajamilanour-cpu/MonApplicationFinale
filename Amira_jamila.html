<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amira_jamila – Cuisine et pâtisserie</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf4f1;--card:#fff;--ink:#3b1f3a;--mute:#74596f;--acc:#c2185b;--onacc:#fff;--gold:#e0a100;--line:#ead9d8;--lock:#f1e6ee;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d0f1d;--card:#2a1829;--ink:#f6e8f1;--mute:#c4a5bb;--acc:#ff6fa5;--onacc:#2a0b1b;--line:#46304a;--lock:#3a2338}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "Public Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",Georgia,serif;line-height:1.1;margin:0}
header,main{max-width:760px;margin:0 auto;padding:0 16px}
header{padding-top:24px}h1{font-size:clamp(2rem,9vw,3rem);font-weight:800;color:var(--acc)}
.sub{color:var(--mute);margin:6px 0 0}
nav{display:flex;gap:6px;overflow-x:auto;padding:14px 16px 10px;max-width:760px;margin:0 auto;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
button,.chip{font:inherit;cursor:pointer;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:99px;white-space:nowrap;font-weight:600;text-decoration:none;display:inline-block}
[aria-selected=true],[aria-pressed=true],.cta{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
section{display:none;padding:10px 0 48px}section.on{display:block}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.rc{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-align:left;padding:0;border-radius:16px;white-space:normal;color:var(--ink)}
.img{height:120px;background-size:cover;background-position:center;background-color:#eee}
.rc .t{padding:10px 12px}.rc b{display:block;font-size:.95rem;line-height:1.25}
.badge{font-size:.78rem;font-weight:700;color:#1f7a4d}.lk .badge{color:var(--acc)}.lk .img{filter:grayscale(.6);opacity:.7}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.big{height:180px;background-size:cover;background-position:center;border-radius:14px;margin-bottom:12px}
ol li,ul li{margin-bottom:8px}.note{font-size:.88rem;color:var(--mute)}
input{font:inherit;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%;margin:8px 0}
.lockbox{background:var(--lock);border-radius:12px;padding:14px;margin-top:12px}
#msg{font-weight:600;margin:6px 0 0}
</style>
</head>
<body>
<header>
<h1>Amira_jamila</h1>
<p class="sub">Cuisine et pâtisserie : africaine, européenne, asiatique. 5 recettes gratuites, le reste à débloquer.</p>
</header>
<nav role="tablist">
<button role="tab" aria-selected="true" data-t="rec">Recettes</button>
<button role="tab" aria-selected="false" data-t="pay">Débloquer</button>
<button role="tab" aria-selected="false" data-t="ct">Contact</button>
</nav>
<main>
<section id="rec" class="on">
<div id="list">
<div class="row" id="cats"></div>
<div class="grid" id="grid"></div>
</div>
<div id="det" hidden></div>
</section>

<section id="pay">
<div class="box">
<h2>Débloquer toutes les recettes</h2>
<p>Accès complet à partir de <b>1000</b> FCFA.</p>
<div class="row"><a class="chip cta" id="wa" target="_blank" rel="noopener" href="#">Demander mon code</a></div>
<input id="code" placeholder="Ton code de déblocage" autocomplete="off">
<button class="chip cta" id="ok">Valider le code</button>
<p id="msg"></p>
</div>
</section>

<section id="ct">
<div class="box">
<h2>Contact</h2>
<p>Une question, un conseil ? Écris-nous.</p>
<div class="row"><a class="chip cta" id="wa2" target="_blank" rel="noopener" href="#">Contacter Amira sur WhatsApp</a></div>
</div>
</section>
</main>

<script>
const $=s=>document.querySelector(s);
const R=[
{"c":"Monde","img":"https://images.unsplash.com/photo-1513104890138-7c749659a591?w=400","f":1,"n":"Pizza maison","i":"1 kg farine;Levure;Sel;Huile;Lait;Eau tiède;Œuf;Sauce tomate","s":"Mélange la pâte.|Laisse lever 1h.|Étale et garnis.|Cuis 6 min à 200°C."},
{"c":"Afrique","img":"https://images.unsplash.com/photo-1548943487-a2e4e43b4853?w=400","f":1,"n":"Thiéboudiène","i":"Poisson;Riz;Légumes;Tomate;Épices","s":"Prépare le poisson.|Cuis les légumes.|Cuis le riz dans le bouillon.|Dresse."},
{"c":"Monde","img":"https://images.unsplash.com/photo-1621996346565-e3dbc646d9a9?w=400","f":1,"n":"Spaghetti bolognaise","i":"Spaghetti;Bœuf haché;Tomate;Oignon;Ail","s":"Fais revenir la viande.|Ajoute la sauce tomate.|Mijote 30 min.|Mélange aux pâtes."},
{"c":"Pâtisserie","img":"https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=400","f":1,"n":"Génoise moelleuse","i":"Œufs;Sucre;Farine;Levure;Vanille","s":"Bats les œufs avec le sucre.|Ajoute la farine.|Cuis 1h à 150°C."},
{"c":"Afrique","img":"https://images.unsplash.com/photo-1608219821358-6b2e3e4b4e5d?w=400","f":1,"n":"Sauce tomate maison","i":"Tomates;Oignon;Ail;Huile;Sucre","s":"Fais suer l'oignon.|Ajoute les tomates.|Mijote 30 min.|Mixe."},
{"c":"Pains","img":"https://images.unsplash.com/photo-1550547660-d9450f859349?w=400","n":"Pain burger"},
{"c":"Pains","img":"https://images.unsplash.com/photo-1509440159596-0249088772ff?w=400","n":"Pain au lait brioché"},
{"c":"Pains","img":"https://images.unsplash.com/photo-1589367920969-ab8e050bbb04?w=400","n":"Pain au lait au chocolat"},
{"c":"Pains","img":"https://images.unsplash.com/photo-1509440159596-0249088772ff?w=400","n":"Pain de mie"},
{"c":"Pâtisserie","img":"https://images.unsplash.com/photo-1550617931-e17a7b70dce2?w=400","n":"Brioche à la confiture"},
{"c":"Pâtisserie","img":"https://images.unsplash.com/photo-1626200419199-391ae4be7a41?w=400","n":"Brioche marbrée Nutella"},
{"c":"Monde","img":"https://images.unsplash.com/photo-1496116218417-1a781b1c416c?w=400","n":"Brioches vapeur"},
{"c":"Afrique","img":"https://images.unsplash.com/photo-1604908176997-125f25cc6f3d?w=400","n":"Yassa"},
{"c":"Afrique","img":"https://images.unsplash.com/photo-1576045057995-568f588f82fb?w=400","n":"Fakoyé"},
{"c":"Afrique","img":"https://images.unsplash.com/photo-1512058564366-18510be2db19?w=400","n":"Mafé"},
{"c":"Afrique","img":"https://images.unsplash.com/photo-1547592180-85f173990554?w=400","n":"Tô"},
{"c":"Afrique","img":"https://images.unsplash.com/photo-1516684732162-798a0062be99?w=400","n":"Thieb yap"},
{"c":"Pâtisserie","img":"https://images.unsplash.com/photo-1550617931-e17a7b70dce2?w=400","n":"Madeleines"},
{"c":"Monde","img":"https://images.unsplash.com/photo-1553163147-622ab57be1c7?w=400","n":"Bibimbap"},
{"c":"Monde","img":"https://images.unsplash.com/photo-1553621042-f6e147245754?w=400","n":"Onigiri"}
];
let tok="",cat="Tout",P={};
function go(t){document.querySelectorAll("nav button").forEach(x=>x.setAttribute("aria-selected",x.dataset.t===t));document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id===t));window.scrollTo(0,0)}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.t));
function list(){
 $("#cats").innerHTML=["Tout","Afrique","Pains","Pâtisserie","Monde"].map(c=>`<button class="chip" data-c="${c}" aria-pressed="${c===cat}">${c}</button>`).join("");
 $("#cats").querySelectorAll("button").forEach(b=>b.onclick=()=>{cat=b.dataset.c;list()});
 $("#grid").innerHTML=R.map((r,k)=>[r,k]).filter(([r])=>cat==="Tout"||r.c===cat).map(([r,k])=>{const o=!!(r.f||P[k]);return `<button class="rc ${o?"":"lk"}" data-k="${k}"><div class="img" style="background-image:url('${r.img}')"></div><div class="t"><b>${r.n}</b><span class="badge">${r.f?"Gratuit":o?"Débloquée":"🔒 Premium"}</span></div></button>`}).join("");
 $("#grid").querySelectorAll("button").forEach(b=>b.onclick=()=>show(+b.dataset.k));
}
function show(k){
 const r=R[k],f=r.f||P[k];$("#list").hidden=true;const d=$("#det");d.hidden=false;
 let h=`<button class="chip" id="bk">← Retour</button><div class="box" style="margin-top:12px"><div class="big" style="background-image:url('${r.img}')"></div><h2>${r.n}</h2>`;
 if(f) h+=`<h3>Ingrédients</h3><ul>${r.i.split(";").map(x=>`<li>${x}</li>`).join("")}</ul><h3>Préparation</h3><ol>${r.s.split("|").map(x=>`<li>${x}</li>`).join("")}</ol>`;
 else h+=`<div class="lockbox">🔒 Premium. 1000 FCFA.<div class="row"><button class="chip cta" id="gp">Débloquer</button></div></div>`;
 d.innerHTML=h+"</div>";$("#bk").onclick=back;
 if($("#gp"))$("#gp").onclick=()=>{back();go("pay")};
 window.scrollTo(0,0);
}
function back(){$("#det").hidden=true;$("#list").hidden=false;list()}
$("#ok").onclick=async()=>{
 const m=$("#msg");m.textContent="Vérification…";
 // Simulation pour le test
 setTimeout(()=>{m.textContent="Bravo, recettes débloquées !";P={0:1,1:1,2:1,3:1,4:1};list()}, 1000);
};
fetch("/api/config").then(r=>r.json()).then(j=>{$("#wa").href=j.wa;$("#wa2").href=j.wa}).catch(()=>{});
list();
</script>
</body>
</html>
